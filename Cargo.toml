[package]
name = "aio-plugin-tv-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
base64 = "0.22.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
topcoat = { version = "0.6.2", default-features = false, features = ["discover", "router", "serve", "tower", "view"] }
tower-http = { version = "0.6.2", features = ["fs"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
